name: L_Amour
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

# Configuration for Flutter Launcher Icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/image/logo.png"

# Configuration for Flutter Native Splash
flutter_native_splash:
  color: "#FFFFFF"
  image: lib/assets/image/logo.png

flutter:
  uses-material-design: true
  assets:
    - lib/assets/image/